apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: poc-rabbitmq-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cloud-secret-store
    kind: ClusterSecretStore
  target:
    name: poc-rabbitmq-secret
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: poc/rabbitmq/url
    - secretKey: RABBITMQ_USERNAME
      remoteRef:
        key: poc/rabbitmq/username
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: poc/rabbitmq/password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-dotnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-dotnet
  template:
    metadata:
      labels:
        app: consumer-dotnet
    spec:
      containers:
        - name: consumer-dotnet
          image: example/poc-consumer-dotnet:latest
          envFrom:
            - secretRef:
                name: poc-rabbitmq-secret
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq.internal
            - name: RABBITMQ_PORT
              value: "5671"
            - name: RABBITMQ_TLS_ENABLED
              value: "true"
