services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: poc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    container_name: poc-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s
    restart: unless-stopped

  producer-go:
    build:
      context: ../services/producer-go
    container_name: poc-producer-go
    env_file:
      - ${ENV_FILE:-../infra/environments/local.env.example}
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer-py:
    build:
      context: ../services/consumer-py
    container_name: poc-consumer-py
    env_file:
      - ${ENV_FILE:-../infra/environments/local.env.example}
    ports:
      - "9100:9100"
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["python-consumer"]
    restart: unless-stopped

  consumer-dotnet:
    build:
      context: ../services/consumer-dotnet
    container_name: poc-consumer-dotnet
    env_file:
      - ${ENV_FILE:-../infra/environments/local.env.example}
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["dotnet-consumer"]
    restart: unless-stopped
