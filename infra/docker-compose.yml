services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: poc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  kafka:
    # KRaft layout matches apache/kafka official single-node plaintext example so the broker starts reliably in CI.
    image: apache/kafka:3.8.1
    container_name: poc-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  producer-go:
    build:
      context: ../services/producer-go
    container_name: poc-producer-go
    env_file:
      - ${ENV_FILE:-../infra/environments/local.env.example}
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer-py:
    build:
      context: ../services/consumer-py
    container_name: poc-consumer-py
    env_file:
      - ${ENV_FILE:-../infra/environments/local.env.example}
    ports:
      - "9100:9100"
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["python-consumer"]
    restart: unless-stopped

  consumer-dotnet:
    build:
      context: ../services/consumer-dotnet
    container_name: poc-consumer-dotnet
    env_file:
      - ${ENV_FILE:-../infra/environments/local.env.example}
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["dotnet-consumer"]
    restart: unless-stopped
